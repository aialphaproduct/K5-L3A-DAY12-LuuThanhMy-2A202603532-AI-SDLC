<!doctype html><html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dao Den Long</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#090a18;color:#fff;font:14px system-ui}canvas{width:100%;height:100%}.hud{position:fixed;inset:22px 24px auto;display:flex;justify-content:space-between}.brand{color:#f2c77a;letter-spacing:3px}.panel{background:#111426dd;border:1px solid #66506b;border-radius:8px;padding:12px 16px;line-height:1.8}.controls{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#101322dd;padding:10px 16px;border:1px solid #66506b;border-radius:8px;color:#d6cde0;white-space:nowrap}.title{position:fixed;top:45%;width:100%;text-align:center;font:clamp(30px,6vw,70px) Georgia;color:#ffd58a;text-shadow:0 3px 24px #f29f37}.title small{display:block;font:14px system-ui;letter-spacing:2px}</style><canvas id="c"></canvas><div class="hud"><div><div class="brand">ĐẢO ĐÈN LỒNG</div><small>ĐÊM 1 · ĐẢO BẾN</small></div><div class="panel">✦ Đom đóm <b id="m">3</b> / 5<br>♥ Lửa <b>3</b> / 3<br>◎ Điểm <b id="s">0</b><br>◉ Đèn <b id="l">1</b> / 5</div></div><div class="title">Đảo Đèn Lồng<small>WASD DI CHUYỂN · SPACE TỎA SÁNG</small></div><div class="controls">W A S D di chuyển · SPACE xua Bóng Mực · E thắp đèn</div><script>
const c=document.querySelector('#c'),x=c.getContext('2d');let W,H,k={},p={x:0,y:0},ls=[],ms=[],ss=[{x:4,y:-3}],lit=1,score=0;function size(){W=c.width=innerWidth;H=c.height=innerHeight;ls=[];for(let i=0;i<5;i++){let a=i*6.28/5;ls.push({x:Math.cos(a)*180,y:Math.sin(a)*180,on:i==0})}ms=Array.from({length:20},(_,i)=>({x:Math.cos(i*2.4)*(70+i%5*20),y:Math.sin(i*2.4)*(70+i%5*20)}))}onresize=size;size();onkeydown=e=>k[e.key.toLowerCase()]=1;onkeyup=e=>k[e.key.toLowerCase()]=0;function loop(){requestAnimationFrame(loop);x.fillStyle='#101025';x.fillRect(0,0,W,H);let q=(a,b)=>[W/2+(a-b)*.8,H*.57+(a+b)*.32];x.fillStyle='#39334b';x.beginPath();for(let i=0;i<8;i++){let a=i*.785,[u,v]=q(Math.cos(a)*300,Math.sin(a)*300);i?x.lineTo(u,v):x.moveTo(u,v)}x.closePath();x.fill();if(k.w)p.y-=2;if(k.s)p.y+=2;if(k.a)p.x-=2;if(k.d)p.x+=2;function dot(o,col,r){let [u,v]=q(o.x,o.y);x.fillStyle=col;x.beginPath();x.arc(u,v,r,0,7);x.fill()}ls.forEach(o=>{let[u,v]=q(o.x,o.y);x.fillStyle=o.on?'#ffcf70':'#67506e';x.fillRect(u-4,v-35,8,35);dot({x:o.x,y:o.y-35},o.on?'#ffdc82':'#67506e',10)});ms.forEach(o=>dot({x:o.x,y:o.y-15},'#fff2a0',4));ss.forEach(o=>dot(o,'#2b1a3b',16));dot({x:p.x,y:p.y-20},'#e7ad6d',13);if(k.e){let o=ls.find(a=>!a.on&&Math.hypot(a.x-p.x,a.y-p.y)<45);if(o){o.on=1;lit++;score+=100;document.querySelector('#l').textContent=lit;document.querySelector('#s').textContent=score}k.e=0}}loop();</script></html>
